version: '3.8'

services:
  db:
    image: postgres:16
    container_name: smarthealth-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smarthealth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smarthealth}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smarthealth-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarthealth-backend
    restart: always
    environment:
      - APP_NAME=Smart Healthcare Platform
      - VERSION=1.0.0
      - DEBUG=True
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smarthealth}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-healthcare-key-change-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smarthealth-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smarthealth-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smarthealth-network

volumes:
  postgres_data:
    driver: local

networks:
  smarthealth-network:
    driver: bridge
